# .pipeline/azure-pipelines.yml — YourBus_Back
#
# Flujo DevOps: 3 etapas secuenciales (Compile/Build -> Package -> Deploy).
# La etapa Deploy promueve el mismo artefacto por DEV -> QA -> PROD.
# QA corre pruebas de integración adicionales antes de habilitar el paso a PROD.
#
# Variables que deben existir en el variable group 'YourBus-Backend-Vars':
#   MONGODB_URI_DEV/QA/PROD, CORS_ORIGIN_DEV/QA/PROD  (ya existentes)
#   JWT_SECRET       (secreta, mínimo 16 caracteres al azar) firma las sesiones
#   ADMIN_EMAIL      correo del administrador inicial
#   ADMIN_PASSWORD   (secreta, mínimo 8 caracteres, sin comillas) su contraseña
#
# Inspección de código con SonarCloud: se activa cambiando runSonar a 'true'
# cuando ya exista la organización, el proyecto y la service connection
# 'SonarCloud' (pasos en el README, sección "SonarCloud").

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'

pr:
  branches:
    include:
      - main

variables:
  - name: nodeVersion
    value: '22.x'
  - name: runSonar
    value: 'false'
  - name: sonarOrganization
    value: 'TU-ORGANIZACION-SONAR'
  - name: sonarProjectKey
    value: 'TU-ORGANIZACION-SONAR_YourBus_Back'
  - group: 'YourBus-Backend-Vars'

stages:

  # ---------------------------------------------------------------------
  # 1) COMPILE / BUILD — instala dependencias y corre Quality Gates
  # ---------------------------------------------------------------------
  - stage: Build
    displayName: '1. Compile / Build'
    jobs:
      - job: BuildAndValidate
        displayName: 'Instalar, analizar y probar'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Historial completo: SonarCloud lo necesita para atribuir líneas nuevas.
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Usar Node.js $(nodeVersion)'

          # (desactivado hasta instalar la extensión SonarQube Cloud; ver README, sección SonarCloud)
          # - task: SonarCloudPrepare@4
          #   condition: eq(variables['runSonar'], 'true')
          #   displayName: 'SonarCloud: preparar análisis'
          #   inputs:
          #     SonarCloud: 'SonarCloud'
          #     organization: '$(sonarOrganization)'
          #     scannerMode: 'cli'
          #     configMode: 'manual'
          #     cliProjectKey: '$(sonarProjectKey)'
          #     cliProjectName: 'YourBus_Back'
          #     cliSources: 'src'
          #     extraProperties: |
          #       sonar.tests=tests
          #       sonar.javascript.lcov.reportPaths=coverage/lcov.info
          #       sonar.exclusions=**/node_modules/**,coverage/**,test-results/**

          # HUSKY=0: los hooks de git son para el computador del desarrollador, no para CI.
          - script: npm ci
            displayName: 'npm ci'
            env:
              HUSKY: '0'

          # --- Quality Gate: análisis estático de código ---
          - script: npm run lint
            displayName: 'Quality Gate: lint (eslint)'

          # --- Quality Gate: pruebas unitarias/integración + cobertura ---
          - script: npm test -- --ci
            displayName: 'Quality Gate: pruebas (jest + supertest + mongodb-memory-server)'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/*.xml'
              testRunTitle: 'YourBus_Back - Unit & Integration Tests'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

          # --- Quality Gate: inspección de código en SonarCloud ---
          # (desactivado hasta instalar la extensión SonarQube Cloud; ver README, sección SonarCloud)
          # - task: SonarCloudAnalyze@4
          #   condition: and(succeeded(), eq(variables['runSonar'], 'true'))
          #   displayName: 'SonarCloud: analizar código'

          # (desactivado hasta instalar la extensión SonarQube Cloud; ver README, sección SonarCloud)
          # - task: SonarCloudPublish@4
          #   condition: and(succeeded(), eq(variables['runSonar'], 'true'))
          #   displayName: 'SonarCloud: publicar resultado'
          #   inputs:
          #     pollingTimeoutSec: '300'

          - script: |
              node -e "require('./src/app.js'); console.log('OK: la app carga correctamente')"
            displayName: 'Verificar que la app carga sin errores'

          - publish: '$(System.DefaultWorkingDirectory)'
            artifact: 'backend-source'
            displayName: 'Publicar código fuente validado'

  # ---------------------------------------------------------------------
  # 2) PACKAGE — empaqueta la app lista para desplegar
  # ---------------------------------------------------------------------
  - stage: Package
    displayName: '2. Package'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PackageArtifact
        displayName: 'Empaquetar backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: 'backend-source'

          # El historial de git y la carpeta de SonarCloud no deben viajar a producción.
          - script: rm -rf "$(Pipeline.Workspace)/backend-source/.git" "$(Pipeline.Workspace)/backend-source/.scannerwork"
            displayName: 'Quitar .git y .scannerwork del paquete'

          - task: ArchiveFiles@2
            displayName: 'Comprimir código + package.json en zip versionado'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/backend-source'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/yourbus-back-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/yourbus-back-$(Build.BuildId).zip'
            artifact: 'backend-package'
            displayName: 'Publicar paquete final'

  # ---------------------------------------------------------------------
  # 3) DEPLOY — promoción secuencial DEV -> QA -> PROD
  #    Los tres ambientes usan el mismo puerto (8080), el estándar de
  #    Azure App Service Linux para Node.
  # ---------------------------------------------------------------------
  - stage: Deploy_DEV
    displayName: '3. Deploy - DEV'
    dependsOn: Package
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        displayName: 'Desplegar a DEV'
        environment: 'yourbus-back-dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (DEV)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-back-dev'
                    package: '$(Pipeline.Workspace)/backend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'npm start'
                    appSettings: '-PORT "8080" -WEBSITES_PORT "8080" -AUTO_SEED "true" -JWT_SECRET "$(JWT_SECRET)" -ADMIN_EMAIL "$(ADMIN_EMAIL)" -ADMIN_PASSWORD "$(ADMIN_PASSWORD)" -TZ_OPERACION "America/Santiago" -NODE_ENV "development" -CORS_ORIGIN "$(CORS_ORIGIN_DEV)" -MONGODB_URI "$(MONGODB_URI_DEV)"'

                - script: |
                    URL="https://yourbus-back-dev-bqhfb6hghpg3h7a2.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que la aplicación inicie en DEV..."
                    sleep 30
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/rutas")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "DEV respondiendo HTTP 200 OK."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: DEV no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                  displayName: 'Verificación post-despliegue en DEV'

  - stage: Deploy_QA
    displayName: '3. Deploy - QA'
    dependsOn: Deploy_DEV
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        displayName: 'Desplegar y validar en QA'
        environment: 'yourbus-back-qa'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (QA)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-back-qa2'
                    package: '$(Pipeline.Workspace)/backend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'npm start'
                    appSettings: '-PORT "8080" -WEBSITES_PORT "8080" -AUTO_SEED "true" -JWT_SECRET "$(JWT_SECRET)" -ADMIN_EMAIL "$(ADMIN_EMAIL)" -ADMIN_PASSWORD "$(ADMIN_PASSWORD)" -TZ_OPERACION "America/Santiago" -NODE_ENV "qa" -CORS_ORIGIN "$(CORS_ORIGIN_QA)" -MONGODB_URI "$(MONGODB_URI_QA)"'

                # --- Quality Gate de QA: pruebas contra la API ya desplegada ---
                - script: |
                    URL="https://yourbus-back-qa2-hqhuezhzaeceajd8.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que Azure extraiga e inicie la app en QA..."
                    sleep 30
                    echo "Esperando a que la aplicación responda en QA (hasta 3 minutos adicionales)..."
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/rutas")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "App arriba y respondiendo HTTP 200 OK en $((30 + i * 10)) segundos."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: La aplicación en QA no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                    echo "Verificando endpoint /api/rutas en QA..."
                    curl -sSf "$URL/api/rutas" || exit 1
                  displayName: 'Quality Gate QA: pruebas de humo sobre la API desplegada'

  - stage: Deploy_PROD
    displayName: '3. Deploy - PROD'
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        displayName: 'Desplegar a PROD'
        environment: 'yourbus-back-prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (PROD)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-back-prod'
                    package: '$(Pipeline.Workspace)/backend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'npm start'
                    appSettings: '-PORT "8080" -WEBSITES_PORT "8080" -AUTO_SEED "true" -JWT_SECRET "$(JWT_SECRET)" -ADMIN_EMAIL "$(ADMIN_EMAIL)" -ADMIN_PASSWORD "$(ADMIN_PASSWORD)" -TZ_OPERACION "America/Santiago" -NODE_ENV "production" -CORS_ORIGIN "$(CORS_ORIGIN_PROD)" -MONGODB_URI "$(MONGODB_URI_PROD)"'

                - script: |
                    URL="https://yourbus-back-prod-h7a6hwhhhfd0ere0.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que la aplicación inicie en PROD..."
                    sleep 30
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/rutas")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "PROD respondiendo HTTP 200 OK."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: PROD no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                  displayName: 'Verificación post-despliegue en PROD'